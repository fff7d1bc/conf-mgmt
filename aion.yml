#!/usr/bin/env ansible-playbook

- name: aion
  gather_facts: true
  gather_subset:
    - min
  hosts: [all]
  vars:
    confmgmt:
      homebrew:
        user: piotr
        formulas:
          - ffmpeg-full
          - svt-av1
          - codex
      apt:
        disable_periodic_updates: True
        repositories:
          - syncthing
          - tailscale
        packages:
          - acl
          - bubblewrap
          - ncdu
          - ripgrep
          - sqlite3
          - jq
          - aria2
          - avahi-daemon
          - wireguard
          - net-tools
          - tmux
          - distrobox
          - golang
          - rust-all
          - borgbackup
          - mkvtoolnix
          - rclone
          - zsh
          - syncthing
          - tailscale
          - lm-sensors
          - rsync
          - htop
          - btop
          - make
          - cmake
          - gcc
      sshd: 
      pam:
      sudo:
      udev:
      sysctl:
      home_files:
        files:
          root:
            - bash
            - zsh
            - tmux
            - git
            - vim
          piotr:
            - bash
            - zsh
            - mpv
            - tmux
            - git
            - vim
  roles:
    - role: meta
