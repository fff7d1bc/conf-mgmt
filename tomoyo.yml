#!/usr/bin/env ansible-playbook

- name: tomoyo
  gather_facts: true
  gather_subset:
    - min
  hosts: [all]
  vars:
    confmgmt:
      rpm_ostree:
        kargs:
          - amdgpu.abmlevel=0
          - amdgpu.gttsize=114688
          - ttm.pages_limit=29360128
          - ttm.page_pool_size=29360128
        packages:
          - zsh
          - syncthing
          - htop
          - jetbrains-mono-fonts-all
          - vim
          - tailscale
          - lm_sensors
          - docker-cli
          - virt-manager
          - btop
          - tmux
          - steam
          - steam-devices
          - gamescope
          - gcc
          - gcc-c++
          - make
          - cmake
          - glibc-devel
          - glibc-static
          - pkgconf-pkg-config
          - kernel-headers
          - golang
          - rust
      flatpak:
        packages:
          - io.github.ilya_zlobintsev.LACT
          - it.mijorus.gearlever
      homebrew:
        user: piotr
        formulas:
          - ffmpeg-full
          - svt-av1
          - borgbackup
          - mkvtoolnix
          - rclone
          - yt-dlp
          - mpv
          - ripgrep
          - codex
      sshd: 
      plasmalogin:
      systemd:
        logind:
          linger_users:
            - piotr
      home_files:
        files:
          root:
            - bash
            - zsh
            - tmux
            - git
            - vim
          piotr:
            - bash
            - zsh
            - mpv
            - wezterm
            - tmux
            - git
            - vim
  roles:
    - role: meta
