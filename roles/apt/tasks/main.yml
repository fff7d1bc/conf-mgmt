- name: apt
  tags: [apt]
  block:
    - name: disable periodic apt updates
      when: confmgmt.apt.disable_periodic_updates | default(False)
      block:
        - name: disable apt periodic actions
          copy:
            dest: /etc/apt/apt.conf.d/99-confmgmt-disable-periodic-updates
            content: |
              APT::Periodic::Enable "0";
              APT::Periodic::Update-Package-Lists "0";
              APT::Periodic::Unattended-Upgrade "0";
            owner: root
            group: root
            mode: "0644"

        - name: disable apt timers
          systemd_service:
            name: "{{ apt_timer }}"
            state: stopped
            enabled: False
            masked: True
          loop:
            - apt-daily.timer
            - apt-daily-upgrade.timer
          loop_control:
            loop_var: apt_timer

    - name: apt repositories
      when: confmgmt.apt.repositories is defined
      block:
        - name: validate apt repositories
          assert:
            that: apt_repository_name in apt_repository_definitions
            fail_msg: "Unsupported apt repository: {{ apt_repository_name }}"
            quiet: True
          loop: "{{ confmgmt.apt.repositories }}"
          loop_control:
            loop_var: apt_repository_name
            label: "{{ apt_repository_name }}"

        - name: apt keyring directories
          file:
            path: "{{ apt_repository_definitions[apt_repository_name].keyring | dirname }}"
            state: directory
            owner: root
            group: root
            mode: "0755"
          loop: "{{ confmgmt.apt.repositories }}"
          loop_control:
            loop_var: apt_repository_name
            label: "{{ apt_repository_name }}"

        - name: apt repository keys
          get_url:
            url: "{{ apt_repository_definitions[apt_repository_name].key_url }}"
            dest: "{{ apt_repository_definitions[apt_repository_name].keyring }}"
            owner: root
            group: root
            mode: "0644"
          loop: "{{ confmgmt.apt.repositories }}"
          loop_control:
            loop_var: apt_repository_name
            label: "{{ apt_repository_name }}"

        - name: apt deb822 repositories
          deb822_repository:
            name: "{{ apt_repository_name }}"
            types: "{{ apt_repository_definitions[apt_repository_name].types }}"
            uris: "{{ apt_repository_definitions[apt_repository_name].uris }}"
            suites: "{{ apt_repository_definitions[apt_repository_name].suites }}"
            components: "{{ apt_repository_definitions[apt_repository_name].components }}"
            signed_by: "{{ apt_repository_definitions[apt_repository_name].keyring }}"
            mode: "0644"
            state: present
            install_python_debian: True
          loop: "{{ confmgmt.apt.repositories }}"
          loop_control:
            loop_var: apt_repository_name
            label: "{{ apt_repository_name }}"

    - name: apt dist-upgrade
      apt:
        update_cache: True
        autoclean: True
        autoremove: True
        upgrade: dist

    - name: apt packages
      when: confmgmt.apt.packages is defined
      apt:
        name: "{{ confmgmt.apt.packages }}"
        update_cache: True
        state: present
