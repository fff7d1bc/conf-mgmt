- name: homebrew
  tags: [homebrew]
  become: "{{ 'yes' if ansible_facts.user_id != confmgmt.homebrew.user else 'no' }}"
  become_user: "{{ confmgmt.homebrew.user }}"
  block:
    - name: manage homebrew packages
      confmgmt_homebrew:
        formulas: "{{ confmgmt.homebrew.formulas | default([]) }}"
        casks: "{{ confmgmt.homebrew.casks | default([]) }}"
        update_homebrew: True
        upgrade_all: True
        greedy: True
        cleanup: on_package_change
      register: homebrew_result
  rescue:
    - name: report homebrew failure unrelated to sudo authentication
      when: not (homebrew_result.needs_sudo | default(False) | bool)
      fail:
        msg: "{{ homebrew_result.msg | default('Homebrew management failed') }}"

    - name: sudo password for homebrew casks
      when: homebrew_result.needs_sudo | default(False) | bool
      no_log: True
      pause:
        prompt: "SUDO_PASSWORD: "
        echo: no
      register: homebrew_sudo_password

    - name: retry homebrew packages with sudo password
      when: homebrew_result.needs_sudo | default(False) | bool
      confmgmt_homebrew:
        formulas: "{{ confmgmt.homebrew.formulas | default([]) }}"
        casks: "{{ confmgmt.homebrew.casks | default([]) }}"
        update_homebrew: False
        upgrade_all: True
        greedy: True
        cleanup: on_package_change
        sudo_password: "{{ homebrew_sudo_password.user_input }}"
