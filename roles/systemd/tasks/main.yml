- name: systemd
  tags: [systemd]
  when: ansible_facts.service_mgr == "systemd"
  block:
    - name: manage system services
      vars:
        # A null policy is shorthand for the common enabled-and-running case.
        # Explicit policies leave omitted properties unmanaged.
        systemd_service_config: >-
          {{
            {'state': 'started', 'enabled': true}
            if systemd_service_item.value is none
            else systemd_service_item.value
          }}
      systemd_service:
        name: "{{ systemd_service_item.key }}"
        state: "{{ systemd_service_config.state | default(omit) }}"
        enabled: "{{ systemd_service_config.enabled | default(omit) }}"
        masked: "{{ systemd_service_config.masked | default(omit) }}"
      loop: "{{ confmgmt.systemd.services | default({}, true) | dict2items }}"
      loop_control:
        loop_var: systemd_service_item
        label: "{{ systemd_service_item.key }}"

    - name: logind configuration directory
      when:
        - >-
          confmgmt.systemd.logind.kill_user_processes is defined or
          confmgmt.systemd.logind.kill_exclude_users is defined
      file:
        path: /etc/systemd/logind.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: logind user process policy
      when:
        - >-
          confmgmt.systemd.logind.kill_user_processes is defined or
          confmgmt.systemd.logind.kill_exclude_users is defined
      copy:
        dest: /etc/systemd/logind.conf.d/xyz-preserve-user-processes.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Login]
          {% if confmgmt.systemd.logind.kill_user_processes is defined %}
          KillUserProcesses={{ confmgmt.systemd.logind.kill_user_processes | ternary('yes', 'no') }}
          {% endif %}
          {% if confmgmt.systemd.logind.kill_exclude_users is defined %}
          KillExcludeUsers={{ confmgmt.systemd.logind.kill_exclude_users | join(' ') }}
          {% endif %}
      notify: reload systemd-logind

    - name: remove unused logind user process policy
      when:
        - confmgmt.systemd.logind.kill_user_processes is not defined
        - confmgmt.systemd.logind.kill_exclude_users is not defined
      file:
        path: /etc/systemd/logind.conf.d/xyz-preserve-user-processes.conf
        state: absent
      notify: reload systemd-logind

    - name: enable user lingering
      when: confmgmt.systemd.logind.linger_users is defined
      command:
        argv:
          - loginctl
          - enable-linger
          - "{{ systemd_linger_user }}"
        creates: "/var/lib/systemd/linger/{{ systemd_linger_user }}"
      loop: "{{ confmgmt.systemd.logind.linger_users }}"
      loop_control:
        loop_var: systemd_linger_user
        label: "{{ systemd_linger_user }}"
